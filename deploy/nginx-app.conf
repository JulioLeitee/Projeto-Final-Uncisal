# /etc/nginx/sites-available/projeto-aplicado
#
# Eixo 1 — Nginx como terminador TLS e proxy reverso para o gunicorn.
# Substitua SEU_IP_PUBLICO pelo IP reservado da instância (3 ocorrências).
#
# Requisitos atendidos:
#   - Redirecionamento automático HTTP -> HTTPS
#   - HTTPS via Let's Encrypt (certificado de IP, perfil shortlived)
#   - PQC ativo: X25519MLKEM768 em primeiro lugar (exige OpenSSL 3.5+)
#   - Nota A no Qualys SSL Labs: TLS 1.2/1.3, apenas cifras com forward secrecy,
#     HSTS, sem renegociação e sem compressão TLS.

# ---------------------------------------------------------------------------
# Porta 80 — só existe para o desafio ACME e para empurrar todo mundo ao HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name SEU_IP_PUBLICO _;

    # webroot do Certbot (o plugin nginx ainda não suporta cert de IP)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Porta 443 — a aplicação
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name SEU_IP_PUBLICO _;

    # --- Certificado (emitido por deploy/issue-cert.sh) --------------------
    ssl_certificate     /etc/letsencrypt/live/projeto-aplicado/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projeto-aplicado/privkey.pem;

    # --- Protocolos: TLS 1.0/1.1 desligados (reprovam no SSL Labs) --------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # em TLS 1.3 a preferência do cliente é OK

    # --- PQC: híbrido pós-quântico como primeira opção --------------------
    # X25519MLKEM768 = ECDH X25519 + ML-KEM-768 (FIPS 203). Requer OpenSSL 3.5+
    # (Ubuntu 26.04 LTS já traz). Os grupos seguintes são o fallback clássico.
    ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1:prime256v1;

    # Apenas suítes TLS 1.2 com ECDHE + AEAD (forward secrecy obrigatório).
    # As suítes de TLS 1.3 são fixas pelo protocolo e não entram aqui.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;         # tickets sem rotação quebram forward secrecy

    # OCSP stapling NÃO é habilitado: a Let's Encrypt desligou seus respondedores
    # OCSP em 2025. Habilitar geraria erro de resolução a cada reload.

    # --- HSTS -------------------------------------------------------------
    # Sem 'preload': a lista de preload não aceita endereços IP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Endurecimento geral ---------------------------------------------
    server_tokens off;               # não revela a versão do Nginx
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    access_log /var/log/nginx/projeto-aplicado.access.log;
    error_log  /var/log/nginx/projeto-aplicado.error.log warn;

    # Arquivos estáticos servidos direto pelo Nginx
    location /static/ {
        alias /opt/projeto-aplicado/app/static/;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # --- Proxy para o gunicorn (loopback apenas) --------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Sobrescreve (não acrescenta) o X-Forwarded-For: impede que o cliente
        # forje o próprio IP e escape do bloqueio por tentativas de login.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_redirect off;
    }
}
