# /etc/ssh/sshd_config.d/99-hardening.conf
#
# Eixo 1 — acesso administrativo EXCLUSIVAMENTE por chave SSH.
# Autenticação por senha desabilitada em todos os caminhos possíveis.
#
# ATENÇÃO: antes de aplicar, confirme que sua chave pública já está em
# ~/.ssh/authorized_keys e que você consegue logar com ela em OUTRA sessão.
# Aplicar isto sem a chave funcionando tranca você para fora da instância.

# --- Sem senha, sem exceção ------------------------------------------------
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
UsePAM yes
PermitEmptyPasswords no

# --- Somente chave pública -------------------------------------------------
PubkeyAuthentication yes
AuthenticationMethods publickey

# --- Root não loga diretamente ---------------------------------------------
PermitRootLogin no

# --- Superfície reduzida ---------------------------------------------------
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
MaxAuthTries 4
MaxSessions 4
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# --- Log em nível que alimenta o Fail2Ban ----------------------------------
LogLevel VERBOSE

# --- Restringe quem pode entrar (troque pelo seu usuário) ------------------
# AllowUsers ubuntu deploy
